<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <title>A co-op group: one host and up to three clients on one port; per-turn hashes must agree; pixels come from the host</title>
  <rect width="760" height="240" rx="10" fill="#f7f8f4"/>
  <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4a3a"/></marker></defs>
  <g fill="#ffffff" stroke="#3d4a3a" stroke-width="1.5">
    <rect x="280" y="20" width="200" height="64" rx="6" fill="#e3efd9"/>
    <rect x="40" y="150" width="190" height="56" rx="6"/>
    <rect x="285" y="150" width="190" height="56" rx="6"/>
    <rect x="530" y="150" width="190" height="56" rx="6"/>
  </g>
  <g fill="#1d2a1b" text-anchor="middle">
    <text x="380" y="46" font-weight="600">host (-scion-role host)</text>
    <text x="380" y="66">captures pixels, port_arg 51234</text>
    <text x="135" y="174" font-weight="600">client:1</text>
    <text x="135" y="192">real clock, no capture</text>
    <text x="380" y="174" font-weight="600">client:2</text>
    <text x="380" y="192">real clock, no capture</text>
    <text x="625" y="174" font-weight="600">client:3</text>
    <text x="625" y="192">real clock, no capture</text>
  </g>
  <g stroke="#3d4a3a" stroke-width="1.5" fill="none" marker-end="url(#c)">
    <path d="M135 148 L300 86"/>
    <path d="M380 148 L380 86"/>
    <path d="M625 148 L460 86"/>
  </g>
  <text x="380" y="228" text-anchor="middle" fill="#3d4a3a" font-size="12">Every process writes {"name":"turn","hash":...} per turn; any mismatch or failing process fails the recipe.</text>
</svg>
