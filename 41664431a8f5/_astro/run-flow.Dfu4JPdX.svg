<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <title>One trial run: the CLI launches copies of one test build, each runs a share of the queue, the CLI compares with baselines</title>
  <rect width="760" height="320" rx="10" fill="#f7f8f4"/>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4a3a"/></marker></defs>
  <g fill="#ffffff" stroke="#3d4a3a" stroke-width="1.5">
    <rect x="20" y="125" width="150" height="70" rx="6" fill="#e3efd9"/>
    <rect x="240" y="30" width="200" height="60" rx="6"/>
    <rect x="240" y="130" width="200" height="60" rx="6"/>
    <rect x="240" y="230" width="200" height="60" rx="6"/>
    <rect x="530" y="80" width="210" height="60" rx="6"/>
    <rect x="530" y="190" width="210" height="60" rx="6" fill="#e3efd9"/>
  </g>
  <g fill="#1d2a1b" text-anchor="middle">
    <text x="95" y="155" font-weight="600">dotnet scion</text>
    <text x="95" y="174">trial run -j 3</text>
    <text x="340" y="56" font-weight="600">Copy q0 (shard 0/3)</text>
    <text x="340" y="74">adapter runs recipes</text>
    <text x="340" y="156" font-weight="600">Copy q1 (shard 1/3)</text>
    <text x="340" y="174">captures, probes, checks</text>
    <text x="340" y="256" font-weight="600">Copy q2 (shard 2/3)</text>
    <text x="340" y="274">writes q2/&lt;Id&gt;/r&lt;n&gt;/</text>
    <text x="635" y="106" font-weight="600">scion/baselines/</text>
    <text x="635" y="124">approved hash, frames, images</text>
    <text x="635" y="216" font-weight="600">summary.json</text>
    <text x="635" y="234">verdict per Id and next step</text>
  </g>
  <g stroke="#3d4a3a" stroke-width="1.5" fill="none" marker-end="url(#b)">
    <path d="M170 150 L238 62"/>
    <path d="M170 160 L238 160"/>
    <path d="M170 170 L238 258"/>
    <path d="M440 60 L528 205"/>
    <path d="M440 160 L528 215"/>
    <path d="M440 260 L528 228"/>
    <path d="M635 140 L635 188"/>
  </g>
</svg>
